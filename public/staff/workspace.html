<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>พื้นที่พนักงาน | TKC Hotel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/staff.css" />
    <link rel="stylesheet" href="/css/staff-improve.css" />
  </head>
  <body>
    <a class="skip-link" href="#staff-content">ข้ามไปยังพื้นที่ทำงาน</a>
    <div class="staff-layout">
      <aside class="staff-sidebar">
        <a class="brand" href="/" aria-label="TKC Hotel หน้าหลัก">
          <img
            class="brand-mark"
            src="/assets/tkc-mark.svg"
            alt=""
            width="48"
            height="48"
          />
          <span>TKC HOTEL<small>พื้นที่ทำงานของทีม</small></span>
        </a>
        <nav id="staffNav" class="staff-nav" aria-label="พื้นที่พนักงาน">
          <a href="/staff/superadmin.html" data-role="superadmin">ผู้ดูแลระบบ</a
          ><a href="/staff/reception.html" data-role="reception">ฝ่ายต้อนรับ</a
          ><a href="/staff/accounting.html" data-role="accounting">ฝ่ายบัญชี</a
          ><a href="/staff/management.html" data-role="management">ฝ่ายบริหาร</a
          ><a href="/staff/housekeeping.html" data-role="housekeeping">แม่บ้าน</a>
        </nav>
        <nav
          id="staffSections"
          class="staff-section-nav"
          aria-label="ไปยังส่วนงาน"
        ></nav>
        <div class="bottom">
          <button id="staffLogout" class="btn btn-outline" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="/assets/icons.svg#log-out" />
            </svg>
            ออกจากระบบ
          </button>
        </div>
      </aside>
      <div class="staff-main">
        <header class="staff-topbar">
          <span class="breadcrumb"
            >พื้นที่ทำงาน <span aria-hidden="true">/</span>
            <span id="breadcrumb">กำลังโหลด</span></span
          >
          <span id="staffUser" class="user"></span>
        </header>
        <main id="staff-content" class="staff-content" tabindex="-1">
          <div class="staff-intro">
            <div>
              <h1 id="pageTitle">กำลังโหลด…</h1>
              <p id="pageSubtitle"></p>
            </div>
            <div class="staff-page-actions">
              <span id="staffUpdated" class="staff-updated" aria-live="polite"
                >กำลังโหลดข้อมูล…</span
              >
              <button
                id="staffRefresh"
                class="btn btn-outline"
                type="button"
                aria-label="โหลดข้อมูลพื้นที่ทำงานอีกครั้ง"
                title="โหลดข้อมูลอีกครั้ง"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/assets/icons.svg#refresh-cw" />
                </svg>
              </button>
              <a class="btn btn-outline" href="/"
                >ดูเว็บไซต์ลูกค้า
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <use href="/assets/icons.svg#arrow-right" /></svg
              ></a>
            </div>
          </div>
          <div
            id="staffStatus"
            class="staff-status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></div>
          <div id="dashboard" aria-busy="true"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/staff/dashboard.js"></script>
  </body>
</html>
