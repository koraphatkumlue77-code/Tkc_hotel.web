<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>จองห้องพัก | TKC Hotel</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      const params = new URLSearchParams(location.search);
      if (location.pathname === "/booking.html" || params.has("typeId"))
        params.set("book", "1");
      location.replace("/?" + params.toString() + "#rooms");
    </script>
  </head>
  <body>
    <p>เลือกห้องและจองได้ในหน้าแรก <a href="/#rooms">เลือกห้องพัก</a></p>
  </body>
</html>
